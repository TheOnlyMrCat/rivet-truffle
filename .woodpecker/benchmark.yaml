when:
  - event: manual
  - event: push
    branch: bench/*

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      recursive: false
      lfs: false

steps:
  - name: Build rivet-truffle
    image: bash
    commands:
      - . /etc/profile
      - nix --extra-experimental-features nix-command --extra-experimental-features flakes develop --command just build

  - name: Benchmark coremark-nommu (50x15 seconds)
    image: bash
    commands:
      - . /etc/profile
      - nix --extra-experimental-features nix-command --extra-experimental-features flakes develop --command just bench-full --target=15

  - name: Benchmark coremark-nommu (10x60 seconds)
    image: bash
    commands:
      - . /etc/profile
      - nix --extra-experimental-features nix-command --extra-experimental-features flakes develop --command just bench-full --runs=10 --target=60

  - name: Benchmark coremark-mmu (50x15 seconds)
    image: bash
    commands:
      - . /etc/profile
      - nix --extra-experimental-features nix-command --extra-experimental-features flakes develop --command just bench-full --mmu=true --target=15

  - name: Benchmark coremark-mmu (10x60 seconds)
    image: bash
    commands:
      - . /etc/profile
      - nix --extra-experimental-features nix-command --extra-experimental-features flakes develop --command just bench-full --mmu=true --runs=10 --target=60
